version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dhani-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dhani}
      POSTGRES_USER: ${POSTGRES_USER:-dhani_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dhani_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dhani-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dhani_user} -d ${POSTGRES_DB:-dhani}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhani-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dhani_user}:${POSTGRES_PASSWORD:-dhani_secure_password}@postgres:5432/${POSTGRES_DB:-dhani}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dhani-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    args:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    container_name: dhani-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dhani-network

volumes:
  postgres_data:

networks:
  dhani-network:
    driver: bridge
